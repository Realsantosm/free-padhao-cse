<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The StudyHub | Professional LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      #sidebar { transition: transform 0.3s ease-in-out; }
      
      /* Login Modal Animation */
      .modal-fade-in { animation: fadeIn 0.3s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900">
    
    <div id="login-modal" class="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl modal-fade-in text-center border border-slate-100">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fas fa-user-graduate"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Welcome Back</h2>
            <p class="text-slate-500 mb-8 text-sm">Enter your name to sync your study progress.</p>
            <input type="text" id="username-input" placeholder="Your Name" class="w-full px-5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 outline-none mb-4 transition-all">
            <button onclick="handleLogin()" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl hover:bg-green-700 transition shadow-lg shadow-green-100">
                Start Learning
            </button>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden relative">
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden" onclick="toggleSidebar()"></div>

      <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white border-r border-slate-200 z-30 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0 flex-shrink-0 flex flex-col">
        <div class="p-6 border-b bg-green-600 flex justify-between items-center">
          <h1 class="text-xl font-bold text-white tracking-tight italic">Padhao | StudyHub</h1>
          <button onclick="toggleSidebar()" class="lg:hidden text-white text-xl"><i class="fas fa-times"></i></button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-1" id="sidebar-nav">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-4 px-3">Subject Categories</p>
        </div>

        <div class="p-4 border-t bg-slate-50">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold">Padhao🚀</div>
            <div>
              <p id="user-display-name" class="text-xs font-bold text-slate-800">Student</p>
              <p class="text-[10px] text-slate-500">Study Well</p>
            </div>
          </div>
        </div>
      </aside>

      <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden w-full">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 md:px-8 z-10">
          <div class="flex items-center space-x-4">
            <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 text-slate-600"><i class="fas fa-bars text-xl"></i></button>
            <h2 class="text-base md:text-lg font-semibold text-slate-700 truncate" id="current-subject-title">Select a Subject</h2>
          </div>
          
          <div class="flex items-center space-x-2 md:space-x-4">
            <button class="text-slate-400 hover:text-indigo-600 transition p-2"><i class="fas fa-search"></i></button>
            <button onclick="handleLogout()" class="flex items-center space-x-2 text-slate-400 hover:text-red-500 transition p-2 ml-2 border-l border-slate-100 pl-4">
                <span class="text-[10px] font-bold uppercase hidden md:block">Logout</span>
                <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
          <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
      </main>
    </div>

    <script>
      // --- Core Data ---
      const subjects = ["Ancient History","Medieval History","Modern History", "Polity", "Art & Culture", "Geography", "Economics", "Science & Tech", "Environment", "CSAT"];
      const subjectData = {
        Ancient_History: [
          { png: "https://img.youtube.com/vi/nSf6t12P1W8/maxresdefault.jpg", title: "Ancient India", video: "https://youtu.be/nSf6t12P1W8", pdf: "#" },
          { png: "https://img.youtube.com/vi/U1FV2SLIjrQ/maxresdefault.jpg", title: "Mughal Empire", video: "https://youtu.be/U1FV2SLIjrQ", pdf: "#" }
        ],
        Medieval_History: [
          { png: "https://img.youtube.com/vi/nSf6t12P1W8/maxresdefault.jpg", title: "Ancient India", video: "https://youtu.be/nSf6t12P1W8", pdf: "#" },
          { png: "https://img.youtube.com/vi/U1FV2SLIjrQ/maxresdefault.jpg", title: "Mughal Empire", video: "https://youtu.be/U1FV2SLIjrQ", pdf: "#" }
        ],
        Modern_History: [
          { png: "https://img.youtube.com/vi/nSf6t12P1W8/maxresdefault.jpg", title: "Ancient India", video: "https://youtu.be/nSf6t12P1W8", pdf: "#" },
          { png: "https://img.youtube.com/vi/U1FV2SLIjrQ/maxresdefault.jpg", title: "Mughal Empire", video: "https://youtu.be/U1FV2SLIjrQ", pdf: "#" }
        ],
        Geography: [
          { png: "https://img.youtube.com/vi/fsosgnVGoFQ/maxresdefault.jpg", title: "Physical Geography", video: "https://youtu.be/fsosgnVGoFQ", pdf: "#" }
        ]
      };

      // --- 3. Persistent Progress Logic ---
      let currentUser = localStorage.getItem('studyhub_user');
      let userProgress = JSON.parse(localStorage.getItem(`progress_${currentUser}`)) || {};

      function checkAuth() {
        if (!currentUser) {
            document.getElementById('login-modal').classList.remove('hidden');
        } else {
            document.getElementById('user-display-name').innerText = currentUser;
            loadSubject(subjects[0]);
        }
      }

      function handleLogin() {
        const name = document.getElementById('username-input').value.trim();
        if (name) {
            localStorage.setItem('studyhub_user', name);
            currentUser = name;
            userProgress = JSON.parse(localStorage.getItem(`progress_${name}`)) || {};
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('user-display-name').innerText = name;
            loadSubject(subjects[0]);
        }
      }

      function handleLogout() {
        localStorage.removeItem('studyhub_user');
        location.reload();
      }

      function toggleTracker(subject, index) {
        const key = `${subject}-${index}`;
        userProgress[key] = !userProgress[key];
        localStorage.setItem(`progress_${currentUser}`, JSON.stringify(userProgress));
        loadSubject(subject); // Refresh UI
      }

      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
        document.getElementById('sidebar-overlay').classList.toggle('hidden');
      }

      // Generate Sidebar
      const sidebarNav = document.getElementById("sidebar-nav");
      subjects.forEach((subject) => {
        const btn = document.createElement("button");
        btn.className = `w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 group hover:bg-indigo-50 hover:text-indigo-600 mb-1`;
        btn.innerHTML = `<i class="fas fa-book-open mr-3 text-slate-400 group-hover:text-indigo-500"></i><span>${subject}</span>`;
        btn.onclick = () => {
            loadSubject(subject);
            if (window.innerWidth < 1024) toggleSidebar();
        };
        sidebarNav.appendChild(btn);
      });

      // --- 4. Render Lectures with Tracker ---
      function loadSubject(subjectName) {
        document.getElementById("current-subject-title").innerText = subjectName;
        const grid = document.getElementById("video-grid");
        grid.innerHTML = "";
        const lectures = subjectData[subjectName] || [];

        if (lectures.length === 0) {
            grid.innerHTML = `<p class="col-span-full text-slate-400 text-center py-10 italic">No content uploaded for ${subjectName} yet.</p>`;
            return;
        }

        lectures.forEach((lecture, index) => {
            const isCompleted = userProgress[`${subjectName}-${index}`];
            const card = document.createElement("div");
            card.className = `bg-white rounded-2xl border transition-all duration-300 overflow-hidden shadow-sm hover:shadow-md group relative ${isCompleted ? 'border-green-200 bg-green-50/20' : 'border-slate-200'}`;
            
            card.innerHTML = `
                <div class="relative aspect-video bg-slate-200 overflow-hidden">
                    <a href="${lecture.video}" target="_blank" class="block w-full h-full">
                        <img src="${lecture.png}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors"></div>
                    </a>
                    ${isCompleted ? '<div class="absolute top-3 left-3 bg-green-500 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-lg">COMPLETED</div>' : ''}
                </div>

                <div class="p-5">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">${subjectName} • Lecture ${index + 1}</span>
                            <h4 class="font-bold text-slate-800 mt-1 line-clamp-1">${lecture.title}</h4>
                        </div>
                        <button onclick="toggleTracker('${subjectName}', ${index})" 
                                class="ml-4 w-7 h-7 rounded-lg border-2 flex items-center justify-center transition-all 
                                ${isCompleted ? 'bg-green-500 border-green-500 text-white' : 'border-slate-200 text-transparent hover:border-green-500'}">
                            <i class="fas fa-check text-xs"></i>
                        </button>
                    </div>
                    
                    <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col sm:flex-row gap-3 items-center justify-between">
                        <a href="${lecture.video}" target="_blank" class="text-xs font-bold text-indigo-600 hover:underline">Watch Video</a>
                        <a href="${lecture.pdf}" target="_blank" class="w-full sm:w-auto flex items-center justify-center text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-2 rounded-lg hover:bg-red-50 hover:text-red-600 transition">
                            <i class="fas fa-file-pdf mr-2"></i> PDF
                        </a>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
      }

      // Initialize
      checkAuth();
    </script>
  </body>
</html>
