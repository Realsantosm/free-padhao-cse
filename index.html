<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The StudyHub | Professional LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar Navigation -->
      <aside
        class="w-72 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col"
      >
        <div class="p-6 border-b bg-green-600">
          <h1 class="text-xl font-bold text-white tracking-tight italic">
            Padhao | StudyHub
          </h1>
        </div>

        <div
          class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-1"
          id="sidebar-nav"
        >
          <p
            class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-4 px-3"
          >
            Subject Categories
          </p>
          <!-- Subject Links injected by JS -->
        </div>

        <div class="p-4 border-t bg-slate-50">
          <div class="flex items-center space-x-3">
            <div
              class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold"
            >
              Padhao🚀
            </div>
            <div>
              <p class="text-xs font-bold">Made with 💖</p>
              <p class="text-[10px] text-slate-500">Study Well</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
        <!-- Top Header -->
        <header
          class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 z-10"
        >
          <h2
            class="text-lg font-semibold text-slate-700"
            id="current-subject-title"
          >
            Select a Subject
          </h2>
          <div class="flex space-x-4">
            <button class="text-slate-400 hover:text-indigo-600 transition">
              <i class="fas fa-search"></i>
            </button>
            <button class="text-slate-400 hover:text-indigo-600 transition">
              <i class="fas fa-bell"></i>
            </button>
          </div>
        </header>

        <!-- Video Grid Area -->
        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
          <div
            id="video-grid"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
          >
            <!-- Cards injected by JS -->
          </div>
        </div>
      </main>
    </div>

    <script>
      // 1. Data Structure: 12 Subjects with 10 Videos each
      const subjects = [
        "History",
        "Geography",
        "Polity",
        "Economics",
        "General Science",
        "Environment",
        "Current Affairs",
        "Ethics",
        "Art & Culture",
        "Mathematics",
        "CSAT",
        "English Literature",
      ];

      // subjectData
      const subjectData = {
        History: [
          {
            png: "https://images.pexels.com/photos/35755755/pexels-photo-35755755.jpeg",
            title: "Ancient India",
            video: "https://youtu.be/nSf6t12P1W8?si=UGxHeZXx6Rdhz_uK",
            pdf: "PDF_URL",
          },
          {
            png: "https://images.pexels.com/photos/35755755/pexels-photo-35755755.jpeg",
            title: "Mughal Empire",
            video: "https://youtu.be/U1FV2SLIjrQ?si=Yq3Q1jhSoZlvIc-9",
            pdf: "PDF_URL",
          },
        ],
        Geography: [
          {
            png: "https://images.pexels.com/photos/35755755/pexels-photo-35755755.jpeg",
            title: "Physical Geography",
            video: "https://youtu.be/fsosgnVGoFQ?si=0Q76o3Fl_d_aBVCV",
            pdf: "PDF_URL",
          },
        ],
        Polity: [
          {
            png: "https://images.pexels.com/photos/35755755/pexels-photo-35755755.jpeg",
            title: "Indian Constitution",
            video: "https://youtu.be/FXDxk-ZTQag?si=WEi9f5kJzS9SCTf1",
            pdf: "PDF_URL",
          },
        ],
        // Add other subjects here exactly as they appear in your sidebar
      };

      // 2. Generate the Sidebar
      const sidebarNav = document.getElementById("sidebar-nav");
      subjects.forEach((subject, index) => {
        const btn = document.createElement("button");
        btn.className = `w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 group hover:bg-indigo-50 hover:text-indigo-600 mb-1`;
        btn.innerHTML = `
                <i class="fas fa-book-open mr-3 text-slate-400 group-hover:text-indigo-500"></i>
                <span>${subject}</span>
            `;
        btn.onclick = () => loadSubject(subject);
        sidebarNav.appendChild(btn);
      });

      // 3. Logic to Load Video Cards
      function loadSubject(subjectName) {
        // 1. Update the Header Title
        document.getElementById("current-subject-title").innerText =
          subjectName;

        // 2. Clear the old cards
        const grid = document.getElementById("video-grid");
        grid.innerHTML = "";

        // 3. Get the list for this specific subject
        const lectures = subjectData[subjectName] || [];

        if (lectures.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-slate-400 text-center py-10 italic">No content uploaded for ${subjectName} yet.</p>`;
          return;
        }

        // 4. Create the unique cards
        lectures.forEach((lecture, index) => {
          const card = document.createElement("div");
          card.className =
            "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow group";

          card.innerHTML = `
        <div class="relative aspect-video bg-slate-200">
            // <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover">
            <img src="${png}">
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition-colors flex items-center justify-center">
                <div class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center text-indigo-600 shadow-xl group-hover:scale-110 transition-transform cursor-pointer">
                    <i class="fas fa-play ml-1"></i>
                </div>
            </div>
        </div>
        <div class="p-5">
            <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">${subjectName} • Lecture ${
            index + 1
          }</span>
            <h4 class="font-bold text-slate-800 mt-1 line-clamp-1">${
              lecture.title
            }</h4>
            <p class="text-xs text-slate-500 mt-2 line-clamp-2">Standard competitive exam concepts for Padhao StudyHub.</p>
            
            <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
                <a href="${
                  lecture.video
                }" target="_blank" class="text-xs font-bold text-indigo-600 hover:underline">Watch Video</a>
                <a href="${
                  lecture.pdf
                }" target="_blank" class="flex items-center text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-2 rounded-lg hover:bg-red-50 hover:text-red-600 transition">
                    <i class="fas fa-file-pdf mr-2"></i> Download PDF
                </a>
            </div>
        </div>
      `;
          grid.appendChild(card);
        });
      }
      // Load first subject by default
      loadSubject(subjects[0]);
    </script>
  </body>
</html>
